# =====================================================================================
# "dev" profile — used for local development (default profile if SPRING_PROFILES_ACTIVE
# is unset). Falls back to conventional local MySQL defaults so a fresh checkout runs
# out of the box, but every value can (and for anything but a throwaway local DB, should)
# be overridden with a real environment variable.
#
# Set these in your shell / IDE run config / a local .env file that is NOT committed:
#   export DB_URL=jdbc:mysql://localhost:3306/InsuranceDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   export DB_USERNAME=root
#   export DB_PASSWORD=your-local-mysql-password
#   export JWT_SECRET=some-long-random-dev-only-string-at-least-32-chars
#   export MAIL_USERNAME=you@gmail.com
#   export MAIL_PASSWORD=your-gmail-app-password
#   export MAIL_ENABLED=true
# =====================================================================================

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/InsuranceDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT =====
# Dev-only fallback secret so the app boots without extra setup. Still 256+ bits, but it is
# PUBLIC (it's in source control) — never use this default outside your own machine, and
# always set a real JWT_SECRET env var in any shared or deployed environment.
jwt.secret=${JWT_SECRET:DevOnlyInsuranceAppSecretKeyNotForProductionUse1234567890}

# ===== CORS =====
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}

# ===== Email (Gmail SMTP) =====
# 1. Turn on 2-Step Verification on your Google account
# 2. Create an "App Password" at https://myaccount.google.com/apppasswords
# 3. Export MAIL_USERNAME / MAIL_PASSWORD in your shell (never commit them)
# 4. Set MAIL_ENABLED=true once configured. Defaults to false so a fresh checkout doesn't
#    try (and fail) to send real email.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:email}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:}
