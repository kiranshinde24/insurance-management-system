# =====================================================================================
# "prod" profile — activate with SPRING_PROFILES_ACTIVE=prod.
#
# Deliberately has NO fallback values for anything secret. If an env var below isn't set,
# Spring Boot fails fast at startup with a clear "could not resolve placeholder" error
# instead of silently booting with a blank/default credential. Set all of these in your
# deployment environment (systemd unit, Docker/K8s secrets, your host's env config, etc.),
# never in a committed file:
#
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET
#   MAIL_USERNAME, MAIL_PASSWORD
#   CORS_ALLOWED_ORIGINS
# =====================================================================================

# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "validate" (not "update"): production schema changes should go through db-migration.sql
# (or a proper migration tool) deliberately, never be auto-applied by Hibernate on boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===== JWT =====
# Required — must be a long, random, secret value (256+ bits). Generate one with e.g.
#   openssl rand -base64 48
jwt.secret=${JWT_SECRET}

# ===== CORS =====
# Comma-separated list of the real frontend origin(s), e.g. https://app.yourinsurer.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# ===== Email (Gmail SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_USERNAME}

# ===== Swagger UI =====
# Consider disabling API docs in production entirely by uncommenting these:
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false
