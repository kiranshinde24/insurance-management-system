# =====================================================================================
# Common configuration shared by every profile. Nothing sensitive lives in this file —
# secrets (DB password, JWT secret, mail credentials) are only ever read from environment
# variables inside application-dev.properties / application-prod.properties.
#
# Active profile is chosen via the SPRING_PROFILES_ACTIVE env var (defaults to "dev" for
# local development). Tests always run under the "test" profile via @ActiveProfiles("test"),
# which is wired to src/test/resources/application-test.properties and never touches this file.
#
#   Local dev:   ./mvnw spring-boot:run                          (defaults to dev)
#   Production:  SPRING_PROFILES_ACTIVE=prod java -jar app.jar   (see application-prod.properties)
# =====================================================================================
spring.application.name=insurance-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== JPA / Hibernate (non-sensitive defaults; overridden per profile below) =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT (lifetimes only — the signing secret is profile-specific, see below) =====
# Access token lifetime: 15 minutes (short-lived on purpose — the frontend transparently
# uses the refresh token to get a new one via POST /api/auth/refresh when this expires)
jwt.expiration=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime: 7 days
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===== File Uploads (claim attachments) =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Scheduler =====
# Cron for the daily policy expiry/renewal check (default: every day at 7 AM server time)
app.scheduler.expiry-check-cron=${EXPIRY_CHECK_CRON:0 0 7 * * *}

# ===== AI Risk Scoring Service (Python FastAPI microservice) =====
# Scores claims for fraud risk. See /insurance-ai in the project root for the
# training pipeline and service code. Run it separately with:
#   uvicorn service.main:app --host 0.0.0.0 --port 8000
ai.risk-service.url=${AI_RISK_SERVICE_URL:http://localhost:8000}
ai.risk-service.enabled=${AI_RISK_SERVICE_ENABLED:true}

# ===== API Docs (springdoc-openapi / Swagger UI) =====
# Swagger UI:       http://localhost:8080/swagger-ui.html
# Raw OpenAPI spec: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
