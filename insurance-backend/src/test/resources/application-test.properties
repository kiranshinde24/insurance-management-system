# ===== Profile used only by @SpringBootTest integration tests (see @ActiveProfiles("test")) =====
# Runs against an in-memory H2 database instead of the real MySQL instance, so tests are
# self-contained and don't need a running MySQL server.

spring.datasource.url=jdbc:h2:mem:insurance_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=0

jwt.secret=TestOnlySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmTests
jwt.expiration=900000
jwt.refresh-expiration=604800000

cors.allowed.origins=http://localhost:3000

# Never actually send email during tests
app.mail.enabled=false
app.mail.from=test@example.com
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

app.upload.dir=build/test-uploads
app.scheduler.expiry-check-cron=0 0 7 * * *
