<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payments | Insurance</title>

  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <nav class="navbar">
    <a class="nav-logo" href="dashboard.html">
      <div class="nav-logo-icon">IN</div>
      <span class="nav-logo-text">In<span>Surance</span></span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="my-policies.html">My Policies</a>
      <a href="my-payments.html" class="active">My Payments</a>
      <a href="my-claims.html">My Claims</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <button id="themeToggle" class="btn-theme-toggle" aria-label="Toggle Dark/Light Theme">Light</button>
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar">CU</div>
        <span id="nav-username">Customer</span>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>My Payments</h1>
        <p>Record payments and track what is paid for your policies.</p>
      </div>
    </div>

    <div class="form-card">
      <h3>Add a Payment</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Policy</label>
          <select id="policy-select"></select>
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="payment-amount" placeholder="Enter amount">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="payment-date">
        </div>
        <div class="form-group">
          <label>Mode</label>
          <select id="payment-mode">
            <option value="">-- Select --</option>
            <option value="Online">Online</option>
            <option value="Cheque">Cheque</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="savePayment(this)">Save Payment</button>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Payment History</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Policy</th>
              <th>Amount</th>
              <th>Mode</th>
              <th>Receipt</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/customer/customer-payments.js"></script>
</body>
</html>
