<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Insurance</title>

  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <nav class="navbar">
    <a class="nav-logo" href="dashboard.html">
      <div class="nav-logo-icon">IN</div>
      <span class="nav-logo-text">In<span>Surance</span></span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="my-policies.html">My Policies</a>
      <a href="my-payments.html">My Payments</a>
      <a href="my-claims.html">My Claims</a>
      <a href="profile.html" class="active">Profile</a>
    </div>
    <div class="nav-right">
      <button id="themeToggle" class="btn-theme-toggle" aria-label="Toggle Dark/Light Theme">Light</button>
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar">CU</div>
        <span id="nav-username">Customer</span>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Profile</h1>
        <p>Update your personal details anytime.</p>
      </div>
    </div>

    <div class="form-card">
      <div class="form-grid">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="profile-username" disabled>
        </div>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="profile-name" placeholder="Full Name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profile-email" placeholder="Email address">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="profile-phone" placeholder="Phone number">
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" id="profile-city" placeholder="City">
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="profile-dob">
        </div>
        <div class="form-group">
          <label>PAN</label>
          <input type="text" id="profile-pan" placeholder="PAN number">
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveProfile(this)">Save Profile</button>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/customer/customer-profile.js"></script>
</body>
</html>
