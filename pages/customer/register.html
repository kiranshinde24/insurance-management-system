<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Insurance</title>

  <link rel="stylesheet" href="../../css/login.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-brand">
        <div class="login-brand-icon">IN</div>
        <span class="login-brand-name">In<span>surance</span></span>
      </div>

      <h2>Create account</h2>
      <p class="sub">Register as a customer to manage your policies and claims.</p>

      <div class="login-error" id="error-msg">
        Please fix the highlighted fields and try again.
      </div>

      <div class="login-field">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Jane Doe">
      </div>
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="email" placeholder="customer@gmail.com">
      </div>
      <div class="login-field">
        <label>Username</label>
        <input type="text" id="username" placeholder="jane.doe">
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="login-field">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••">
      </div>
      <div class="login-field">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="9876543210">
      </div>
      <div class="login-field">
        <label>City</label>
        <input type="text" id="city" placeholder="Mumbai">
      </div>
      <div class="login-field">
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>
      <div class="login-field">
        <label>PAN</label>
        <input type="text" id="pan" placeholder="ABCDE1234F">
      </div>

      <!-- NEW: Agent selection dropdown, populated from localStorage -->
      <div class="login-field">
        <label>Select Agent</label>
        <select id="agent">
          <option value="">-- Select an Agent --</option>
        </select>
      </div>

      <button class="login-btn" onclick="doRegister(this)">Create Account</button>

      <p class="sub" style="text-align:center;margin-top:18px;">Already registered? <a href="../login.html">Sign in</a></p>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/customer/register.js"></script>
</body>
</html>
